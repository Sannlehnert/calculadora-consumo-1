<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Nafta</title>
    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <!-- Fuente -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
</head>

<body>
    <div class="w-full max-w-2xl bg-white rounded-2xl shadow-lg p-6 md:p-8 border border-gray-200">


        <!-- Header -->
        <div class="text-center mb-8">
            <h1 class="text-3xl font-semibold text-green-700">Calculadora de Nafta</h1>
            <p class="text-gray-500 mt-1">Registrá las cargas de tu viaje</p>
        </div>

        <!-- Formulario para agregar cargas múltiple -->
        <div class="bg-amber-50 p-5 rounded-xl mb-6">

            <h2 class="text-xl font-semibold text-green-700 mb-4">Registrar nueva carga</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Kilometraje actual (km)</label>
                    <input type="number" id="km-actual" placeholder="Ej: 12500" step="0.1" required
                        class="w-full border border-gray-300 rounded p-2 focus:ring-2 focus:ring-green-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Litros cargados (L)</label>
                    <input type="number" id="litros-carga" placeholder="Ej: 45.5" step="0.01" required
                        class="w-full border border-gray-300 rounded p-2 focus:ring-2 focus:ring-green-500">
                </div>
            </div>
            <button id="btn-agregar"
                class="mt-4 w-full bg-green-600 hover:bg-green-700 text-white font-medium py-2 rounded-lg transition duration-200 shadow-sm">
                + Agregar carga
            </button>

        </div>

        <!-- Lista visual de cargas registradas -->
        <div class="mb-6">
            <h2 class="text-xl font-semibold text-green-700 mb-3">
                Cargas registradas <span id="contador-cargas" class="text-sm bg-gray-200 px-2 py-1 rounded">0</span>
            </h2>
            <div id="lista-cargas" class="bg-gray-50 rounded-lg p-3 max-h-64 overflow-y-auto border border-gray-200">
                <p class="text-gray-400 text-center py-4">Todavía no hay cargas. Agregá la primera.</p>
            </div>
        </div>

        <!-- Botón finalizar viaje -->
        <div class="flex flex-col sm:flex-row gap-4 justify-between items-center">
            <button id="btn-finalizar"
                class="w-full sm:w-auto bg-amber-400 text-gray-800 font-medium py-2 px-6 rounded-lg hover:bg-amber-500 transition duration-200 shadow-sm">
                Finalizar viaje y calcular
            </button>

            <div id="resultado-final" class="text-sm text-gray-500 italic">
                <!-- Acá aparece el resultado -->
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
